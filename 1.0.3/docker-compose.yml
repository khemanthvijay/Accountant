services:
  backend:
    build:
      context: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      ELECTRO_ACCOUNTANT_DATA_DIR: /data
    volumes:
      - electro-accountant-v103-data:/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  electro-accountant-v103-data:
