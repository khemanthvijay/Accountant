name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress --yes
          }
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.11\bin'
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw "WiX Toolset was not installed correctly."
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-windows-app.ps1 -PackageType exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Electro-Accountant-1.0.2-Windows-Installer
          path: windows-app/*.exe
          if-no-files-found: error
          retention-days: 30
